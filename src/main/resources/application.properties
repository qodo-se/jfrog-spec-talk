spring.application.name=jfrog-spec-talk
spring.main.banner-mode=off

# In-memory H2. DB_CLOSE_DELAY=-1 keeps the schema alive for the lifetime of the JVM
# even when no connection is open.
spring.datasource.url=jdbc:h2:mem:contacts;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
# Required so data.sql runs after Hibernate has created the schema.
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Belt and braces: ApiExceptionHandler already produces RFC 9457 responses, this keeps
# problem details on if that advice is ever removed.
spring.mvc.problemdetails.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
